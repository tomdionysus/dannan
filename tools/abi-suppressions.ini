#
# What `tools/ci.sh abi` leaves out of abidiff's report (the maintainer, 2026-11-15).
#
# The standard library's template instances: the library emits one (weak) only
# while its own code happens to need it out of line, so its appearing or going
# says nothing of Dannan's interface. A host instantiates these itself and never
# links against Dannan's copy (0.8.1: a removed std::promise<void>::~promise()).
# Dannan's own functions, variables and types are judged as before.

[suppress_function]
  name_regexp = ^std::

[suppress_variable]
  name_regexp = ^std::

# Boost's, for the same reason: Asio is headers only, so its instances are as much Dannan's
# code's as the standard library's are (2026-11-22, arm64: a removed
# reactive_socket_service_base::do_start_connect_op after a change in reach/paths.cpp).
[suppress_function]
  name_regexp = ^boost::

[suppress_variable]
  name_regexp = ^boost::
