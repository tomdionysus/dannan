#
# tools/ci.sh's steps on Debian 13, as the nodes have it: the header and format
# check; release builds and the installed package's consumer on x86-64 and on
# arm64, as a Pi builds them; clang with its thread-safety analysis; ASan and
# UBSan on both, TSan; coverage to Codecov; the ABI against the minor's last
# release on both; the Debian packages on both, linted; and a build and test on
# macOS. The Docker NAT bed (test/compose) and the runs
# on the nodes stay by hand.
name: CI

# develop and main only: a feature branch's gate runs on the build cluster. Notes and docs build
# nothing; no test reads them.
on:
  push:
    branches: [develop, main]
    paths-ignore: ["TODO/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["TODO/**", "docs/**", "**/*.md"]

# A newer push to the same ref replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.step }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { step: check, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: clang, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: tsan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: package, arch: x86-64, runner: ubuntu-24.04 }
          - { step: package, arch: arm64, runner: ubuntu-24.04-arm }
    container:
      image: debian:trixie
      # LeakSanitizer needs ptrace to stop the process's threads.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang clang-format cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev libgmock-dev

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ${{ matrix.step }}
        run: tools/ci.sh ${{ matrix.step }}

  # A patch keeps the ABI (the maintainer, 2026-11-13): the library against its minor's last
  # release, on both architectures, by abidiff.
  abi:
    name: abi (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates binutils abigail-tools \
            libboost-dev libssl-dev libyaml-cpp-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the release tags

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: abi
        run: tools/ci.sh abi

  # The Debian packages, on both architectures (arm64 as a Pi builds them): the
  # tests run inside the build, and lintian fails them on any error or warning.
  deb:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev debhelper git ca-certificates lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the package's version

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: apt-get build-dep -y ./

      - name: Build
        run: tools/build-deb.sh

      - name: Lint
        run: lintian --fail-on error,warning build-deb/*.changes

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: build-deb/*.deb

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev libgmock-dev lcov \
            curl gnupg  # Codecov's uploader verifies its own signature

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: tools/ci.sh coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: build-ci/coverage.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
